name: Continuous Integration

# This workflow is MANUAL-ONLY for this port: it no longer runs automatically on
# push or pull_request. Trigger it from the Actions tab ("Run workflow").
# The build/test steps below are unchanged from the previous configuration.
on:
  workflow_dispatch:

permissions:
  contents: read  #  to fetch code (actions/checkout)

jobs:
  linux:
    name: Linux (.NET 8.0)
    runs-on: ubuntu-22.04

    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Install .NET 8.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Check Code
        run: |
          make check
          make tests

      - name: Check Mods
        run: |
          sudo apt-get install lua5.1
          make check-scripts
          make TREAT_WARNINGS_AS_ERRORS=true test

  windows:
    name: Windows (.NET 8.0)
    runs-on: windows-2022

    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Install .NET 8.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Check Code
        shell: powershell
        run: |
          # Work around runtime failures on the GH Actions runner
          dotnet nuget add source https://api.nuget.org/v3/index.json -n nuget.org
          .\make.ps1 check
          .\make.ps1 tests

      - name: Check Mods
        run: |
          choco install lua --version 5.1.5.52 --no-progress
          $ENV:Path = $ENV:Path + ";C:\Program Files (x86)\Lua\5.1\"
          $ENV:TREAT_WARNINGS_AS_ERRORS = "true"
          .\make.ps1 check-scripts
          .\make.ps1 test
